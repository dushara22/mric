# Право на просмотр учебных страниц модуля (/my-module/...).
access my_module:
  title: 'Доступ к страницам My Module'
  description: 'Позволяет пользователям просматривать страницы модуля.'

# Право на администрирование модуля.
administer my_module:
  title: 'Администрировать My Module'
  description: 'Позволяет управлять настройками модуля. Давайте это право только доверенным пользователям.'
  restrict access: true
